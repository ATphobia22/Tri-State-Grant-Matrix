name: Verify PostgreSQL grant API
on:
  push:
    branches: [main]
    paths: ['backend/**','compose.yaml','postman/**','.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**','compose.yaml','postman/**','.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: grantmatrix
          POSTGRES_USER: grantmatrix
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantmatrix -d grantmatrix"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: grantmatrix
      PGUSER: grantmatrix
      PGPASSWORD: ci-test-password
      PUBLIC_ORIGINS: https://atphobia22.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend
      - run: python -m backend.bootstrap
      - run: pytest -q backend/tests
      - name: Docker image build smoke test
        run: docker build -t tristate-grant-api-ci -f backend/Dockerfile .
