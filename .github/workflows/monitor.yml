name: Audit official grant source links
on:
  push:
    branches: [main]
    paths: ['site/data/catalog.json','scripts/monitor.py','.github/workflows/monitor.yml']
  schedule:
    - cron: '15 13 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/monitor.py
      - name: Commit audited link snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/audit.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: audit government source links [skip ci]"
            git push
          fi
