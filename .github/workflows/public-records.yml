name: Monitor county public meeting records
on:
  push:
    branches: [main]
    paths: ['site/data/public-record-sources.json','scripts/monitor_public_records.py','tests/test_public_records.py','.github/workflows/public-records.yml']
  schedule:
    - cron: '45 13 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tri-state-public-records
  cancel-in-progress: false
jobs:
  audit-records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/monitor_public_records.py
      - name: Commit bounded, source-attributed public-record observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/public-records-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: audit official county public records [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
