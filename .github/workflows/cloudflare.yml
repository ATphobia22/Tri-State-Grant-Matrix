name: Verify Cloudflare Worker and D1 SQLite adapter
on:
  push:
    branches: [main]
    paths: ['cloudflare/**','site/data/catalog.json','site/data/public-record-sources.json','.github/workflows/cloudflare.yml']
  pull_request:
    paths: ['cloudflare/**','site/data/catalog.json','site/data/public-record-sources.json','.github/workflows/cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d1-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check cloudflare/src/index.mjs
      - run: node --test cloudflare/tests/*.test.mjs
      - name: Verify Worker bundle without account credentials
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          # Dry-run uses the committed D1 UUID but does not connect to Cloudflare.
          # Never replace the real database binding or store account credentials.
          node -e 'const c=require("fs").readFileSync("wrangler.jsonc","utf8");const j=JSON.parse(c);if(!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(j.d1_databases[0].database_id))throw Error("D1 UUID not configured")'
          npx wrangler deploy --dry-run --outdir=../cf-dry-run
