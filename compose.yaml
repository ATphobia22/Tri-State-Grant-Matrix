name: tristate-grant-matrix
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: grantmatrix
      POSTGRES_USER: grantmatrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantmatrix -d grantmatrix"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: grantmatrix
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      PGDATABASE: grantmatrix
      PGPORT: "5432"
      PUBLIC_ORIGINS: https://atphobia22.github.io
      SYNC_ADMIN_TOKEN: ${SYNC_ADMIN_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.8-27B}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","-m","backend.worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: grantmatrix
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      PGDATABASE: grantmatrix
      PGPORT: "5432"
      SYNC_INTERVAL_SECONDS: "21600"
  proxy:
    image: caddy:2.10-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
